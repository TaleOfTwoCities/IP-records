<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IP Records (Copy)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f7a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#eaeff2;--surface:#fff;--ink:#12202b;--muted:#5b6b78;--line:#d3dce3;--accent:#1f5f7a;--accent-ink:#fff;--bad:#b3261e;
--active:#1f7a4d;--reserved:#8a5a00;--retired:#6b6f76}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--surface:#18232b;--ink:#e6eef3;--muted:#92a3b0;--line:#2a3943;--accent:#6cc0e0;--accent-ink:#0a1a22;--bad:#ff8a80;--active:#6fd49b;--reserved:#e8b45a;--retired:#9aa0a8}}
:root[data-theme="dark"]{--bg:#10181e;--surface:#18232b;--ink:#e6eef3;--muted:#92a3b0;--line:#2a3943;--accent:#6cc0e0;--accent-ink:#0a1a22;--bad:#ff8a80;--active:#6fd49b;--reserved:#e8b45a;--retired:#9aa0a8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 110px}
h1{font:700 30px/1.1 "Familjen Grotesk",system-ui,sans-serif;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.tools{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--retired);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rec[data-s="Active"]{border-left-color:var(--active)}.rec[data-s="Reserved"]{border-left-color:var(--reserved)}
.ip{font:500 20px "JetBrains Mono",ui-monospace,monospace;word-break:break-all}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-weight:500;margin-top:2px}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.note{font-size:14px;margin-top:6px;white-space:pre-wrap}
.acts{display:flex;gap:4px;flex-shrink:0}
.ib{background:none;border:0;color:var(--accent);font:500 14px Inter,sans-serif;padding:6px 8px;cursor:pointer;border-radius:6px}
.ib.del{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:1px dashed var(--line);border-radius:10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;max-width:100%}
.bar>div{max-width:640px;margin:0 auto;display:flex;gap:8px;width:100%}
.btn{border:0;border-radius:8px;padding:12px 16px;font:700 16px "Familjen Grotesk",sans-serif;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.main{flex:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(520px,calc(100% - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>IP records</h1>
  <p class="sub" id="count"></p>
  <div class="tools"><input id="q" type="search" placeholder="Search address, name or note" aria-label="Search records"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>
<div class="bar"><div>
  <button class="btn alt" id="exp">Export</button>
  <button class="btn main" id="add">Add record</button>
</div></div>
<dialog id="dlg">
  <h2 id="dt" style="margin:0;font:700 22px 'Familjen Grotesk',sans-serif">Add record</h2>
  <label for="f-ip">IP address</label>
  <input id="f-ip" placeholder="192.168.1.10 or 2001:db8::1" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="f-name">Name</label>
  <input id="f-name" placeholder="Core firewall">
  <div class="two">
    <div><label for="f-type">Type</label><select id="f-type"><option>Server</option><option>Router</option><option>Firewall</option><option>Switch</option><option>Workstation</option><option>Other</option></select></div>
    <div><label for="f-status">Status</label><select id="f-status"><option>Active</option><option>Reserved</option><option>Retired</option></select></div>
  </div>
  <label for="f-note">Notes</label>
  <textarea id="f-note" rows="3" placeholder="VLAN, location, owner"></textarea>
  <div class="err" id="err" role="alert"></div>
  <div class="fa"><button class="btn alt" id="cancel" type="button">Cancel</button><button class="btn" id="save" type="button">Save record</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var KEY='ip-records-v1',recs=[],filter='All',editId=null;
function load(){try{var r=localStorage.getItem(KEY);recs=r?JSON.parse(r):[]}catch(e){recs=[]}if(!Array.isArray(recs))recs=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(recs))}catch(e){toast('Could not save to this browser')}}
var $=function(i){return document.getElementById(i)};
function v4(s){var p=s.split('.');return p.length===4&&p.every(function(x){return /^\d{1,3}$/.test(x)&&+x<=255})}
function v6(s){if(!/^[0-9a-fA-F:]+$/.test(s)||s.indexOf(':::')>-1)return false;var d=s.split('::');if(d.length>2)return false;
 var g=function(a){return a?a.split(':'):[]};var a=g(d[0]),b=g(d[1]||'');var all=a.concat(b);
 if(!all.every(function(x){return /^[0-9a-fA-F]{1,4}$/.test(x)}))return false;
 return d.length===2?all.length<8:all.length===8}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
 var q=$('q').value.trim().toLowerCase();
 var shown=recs.filter(function(r){return(filter==='All'||r.status===filter)&&(!q||(r.ip+' '+r.name+' '+r.note+' '+r.type).toLowerCase().indexOf(q)>-1)});
 $('count').textContent=recs.length+(recs.length===1?' address stored':' addresses stored')+' on this device';
 var ch='';['All','Active','Reserved','Retired'].forEach(function(f){ch+='<button class="chip" data-f="'+f+'" aria-pressed="'+(f===filter)+'">'+f+'</button>'});
 $('chips').innerHTML=ch;
 if(!shown.length){$('list').innerHTML='<div class="empty">'+(recs.length?'No records match your search.':'No records yet. Add your first IP address.')+'</div>';return}
 $('list').innerHTML=shown.map(function(r){return '<div class="rec" data-s="'+esc(r.status)+'"><div class="row"><div><div class="ip">'+esc(r.ip)+'</div>'+
  '<div class="name">'+esc(r.name||'Unnamed')+'</div><div class="meta">'+esc(r.type)+' · '+esc(r.status)+'</div></div>'+
  '<div class="acts"><button class="ib" data-a="copy" data-id="'+r.id+'">Copy</button><button class="ib" data-a="edit" data-id="'+r.id+'">Edit</button><button class="ib del" data-a="del" data-id="'+r.id+'">Delete</button></div></div>'+
  (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+'</div>'}).join('');
}
function openDlg(r){editId=r?r.id:null;$('dt').textContent=r?'Edit record':'Add record';
 $('f-ip').value=r?r.ip:'';$('f-name').value=r?r.name:'';$('f-type').value=r?r.type:'Server';$('f-status').value=r?r.status:'Active';$('f-note').value=r?r.note:'';$('err').textContent='';
 $('dlg').showModal();$('f-ip').focus()}
function save(){
 var ip=$('f-ip').value.trim().toLowerCase();
 if(!ip){$('err').textContent='Enter an IP address.';return}
 if(!(v4(ip)||v6(ip))){$('err').textContent='That is not a valid IPv4 or IPv6 address. Example: 10.0.0.5';return}
 if(recs.some(function(r){return r.ip===ip&&r.id!==editId})){$('err').textContent='This address is already stored.';return}
 var d={ip:ip,name:$('f-name').value.trim(),type:$('f-type').value,status:$('f-status').value,note:$('f-note').value.trim()};
 if(editId){recs=recs.map(function(r){return r.id===editId?Object.assign({},r,d):r})}else{d.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);recs.unshift(d)}
 persist();$('dlg').close();render();toast('Record saved')}
$('add').onclick=function(){openDlg(null)};
$('cancel').onclick=function(){$('dlg').close()};
$('save').onclick=save;
$('q').oninput=render;
$('chips').onclick=function(e){var f=e.target.getAttribute('data-f');if(f){filter=f;render()}};
$('list').onclick=function(e){var a=e.target.getAttribute('data-a'),id=e.target.getAttribute('data-id');if(!a)return;
 var r=recs.filter(function(x){return x.id===id})[0];if(!r)return;
 if(a==='edit')openDlg(r);
 if(a==='del'&&confirm('Delete '+r.ip+'?')){recs=recs.filter(function(x){return x.id!==id});persist();render();toast('Record deleted')}
 if(a==='copy'){try{navigator.clipboard.writeText(r.ip).then(function(){toast('Copied '+r.ip)},function(){toast('Copy not allowed here')})}catch(x){toast('Copy not allowed here')}}};
$('exp').onclick=function(){if(!recs.length){toast('Nothing to export');return}
 var csv='ip,name,type,status,notes\n'+recs.map(function(r){return[r.ip,r.name,r.type,r.status,r.note].map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
 try{navigator.clipboard.writeText(csv).then(function(){toast('CSV copied to clipboard')},function(){toast('Copy not allowed here')})}catch(x){toast('Copy not allowed here')}};
load();render();
})();
</script>
</body>
</html>
